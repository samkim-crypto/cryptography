[package]
name = "solana-bn254"
description = "BN254 and Poseidon for Solana"
version = "0.1.0"
edition = "2024"
authors = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
exclude = ["scripts/*"]

[features]
# The comparison runner supplies the external Firedancer static library.
firedancer-bench = []

[dependencies]

[dev-dependencies]
criterion = { workspace = true }
rand = { workspace = true }
ark-ff = { workspace = true }
ark-ec = { workspace = true }
ark-bn254 = { workspace = true }
light-poseidon = { workspace = true }
num-bigint = { workspace = true }
solana-bn254-syscall = { path = "../bn254-syscall" }

[[bench]]
name = "fq_bench"
harness = false

[[bench]]
name = "poseidon_bench"
harness = false

[[bench]]
name = "pairing_bench"
harness = false

[[bench]]
name = "gt_bench"
harness = false

[[bench]]
name = "pairing_compare"
harness = false
required-features = ["firedancer-bench"]

[[bench]]
name = "group_compare"
harness = false
required-features = ["firedancer-bench"]
